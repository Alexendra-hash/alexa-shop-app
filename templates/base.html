<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Whispers & Wildflowers — Shop{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-mark" href="{{ url_for('home') }}">Whispers &amp; <em>Wildflowers</em></a>
    <ul class="nav-links">
      <li><a href="{{ url_for('home') }}#shop">Shop</a></li>
      <li><a href="{{ url_for('home') }}#about">About</a></li>
    </ul>
  </div>
</nav>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash-wrap">
      {% for m in messages %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

{% block content %}{% endblock %}

<footer>© 2026 Whispers &amp; Wildflowers by Priscillia Inyamah</footer>

</body>
</html>
